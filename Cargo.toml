[package]
name = "leptos-nebula"
description = "Biblioteca de componentes Leptos com temas por tokens (≈ Quasar para o Leptos)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Repassam o modo de renderização do app para o leptos (ADR-0007).
csr     = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr     = ["leptos/ssr", "leptos_router?/ssr"]
# Dismiss the plugin dialogs on navigation (`DialogSetup::close_on_navigation`); needs a `Router`.
router  = ["dep:leptos_router"]

[dependencies]
futures       = { workspace = true }
hydration_context = { workspace = true }
leptos        = { workspace = true }
leptos_meta   = { workspace = true }
leptos_router = { workspace = true, optional = true }
unicode-normalization = { workspace = true }
wasm-bindgen  = { workspace = true }
js-sys        = { workspace = true }
web-sys       = { workspace = true, features = ["Window", "Document", "Element", "Storage", "MediaQueryList", "MediaQueryListEvent", "HtmlFormElement", "HtmlElement", "NodeList", "SubmitEvent", "Event", "FocusOptions", "Node", "FocusEvent", "MouseEvent", "KeyboardEvent", "HtmlInputElement", "HtmlTextAreaElement", "InputEvent", "ClipboardEvent", "CompositionEvent", "CssStyleDeclaration", "Navigator", "HtmlDialogElement", "AnimationEvent", "EventTarget", "AddEventListenerOptions", "DomRect", "ResizeObserver", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ShadowRoot", "DocumentFragment"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
